<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="styles/normalize.css">
	<link rel="stylesheet" href="styles/style.css">
	<title>Mammut</title>
</head>

<body>
	<!-- главный блок страницы -->
	<section class="hero">

		<div class="hero__grid">
			<!-- левая половина -->
			<div class="hero__bg-pane">
				<img src="images/hero-bg-left-img.jpg" alt="альпинистка" class="hero__bg-img hero__bg-img--filter">
				<div class="hero__overlay"></div>
				<div class="hero__center-divider"></div>
			</div>
			<!-- правая половина -->
			<div class="hero__bg-pane">
				<img src="images/hero-bg-right-img.jpg" alt="лыжник в горах" class="hero__bg-img hero__bg-img--filter">
				<div class="hero__overlay"></div>
			</div>
		</div>

		<header class="hero__header">
			<p class="hero__announcement">Free shipping from 50 EUR</p>
			<nav class="hero__nav container">
				<button id="heroMenuToggleBtn" class="hero__btn" aria-expanded="false" aria-controls="heroSlideMenu">
					<div class="humburger-icon">
						<span class="humburger-line"></span>
						<span class="humburger-line"></span>
					</div>
					<span class="hero__menu-text">Menu</span>
				</button>

				<button id="heroSearchToggleBtn" class="hero__btn" aria-expanded="false" aria-controls="heroSearchForm">
					<span class="hero__search-text">Search</span>
					<svg class="hero__search-icon" viewBox="0 0 24 24">
						<circle cx="11" cy="11" r="7"></circle>
						<line x1="20" y1="20" x2="16.2" y2="16.2"></line>
					</svg>
				</button>
			</nav>
		</header>
	</section>



	<aside id="heroSlideMenu" class="slide-menu" aria-label="Navigation">
		<div class="slide-menu__section">
			<div class="slide-menu__header">
				<span class="slide-menu__header-title">navigation</span>
				<button id="slideCloseBtn" class="slide-menu__close-btn" type="button">
					<span>Close</span>
					<svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
					</svg>
				</button>
			</div>
			<ul class="slide-menu__list">
				<li class="slide-menu__item">
					<a href="#" class="slide-menu__link">
						<span>ski touring</span>
						<span class="slide-menu__badge">new</span>
					</a>
				</li>
				<li class="slide-menu__item">
					<a href="#" class="slide-menu__link">mountaineering</a>
				</li>
				<li class="slide-menu__item">
					<a href="#" class="slide-menu__link">men</a>
				</li>
				<li class="slide-menu__item">
					<a href="#" class="slide-menu__link">women</a>
				</li>
				<li class="slide-menu__item">
					<a href="#" class="slide-menu__link">avalanche safety</a>
				</li>
				<li class="slide-menu__item">
					<a href="#" class="slide-menu__link">equipment & packs</a>
				</li>
			</ul>
		</div>
		<div class="slide-menu__footer">
			<p class="slide-menu__footer__text">Free shipping on all orders from 50 EUR</p>
			<div class="slide-menu__footer-links">
				<a href="#">Stores</a>
				<a href="#">Customer Service</a>
				<a href="#">Journal</a>
			</div>
		</div>
	</aside>

	<script src="javascript/script.js"></script>
</body>

</html>
